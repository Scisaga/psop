<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850" viewBox="0 0 1440 850" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">PSOP 能力构建与使用流程</title>
<desc id="figure-desc">原始材料经 psop@build 形成 build-profile DKP。psop@compile 只读 build 快照，构建具体 EG、headless 可执行世界、训练数据、模型和工作台，形成 compile-profile DKP。EG 只描述任务 SOP，训练语料在数据侧独立引用，Qwen-ASR、YOLO、RelateAnything、MiniCPM-V 4.6 接受独立和组合评测，再导出到终端以照片和提问提供帮助；终端不加载 EG，物理操作由操作者完成，不新增生产阶段。psop@simulate 只读 compile 快照，生成独立 Web 3D 沙盒。沙盒候选反馈经授权和审核后只能进入后续独立 revision，不能修改当前快照。</desc>
