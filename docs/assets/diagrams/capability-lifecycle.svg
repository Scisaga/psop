currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l9 4v6c0 5-9 10-9 10S3 17 3 12V6z M7 12l3 3 7-7"/></symbol><symbol id="icon-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 8A8 8 0 0 0 5 6L2 9 M2 3v6h6 M4 16a8 8 0 0 0 15 2l3-3 M16 15h6v6"/></symbol><symbol id="icon-device" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8 M12 17v4 M7 8h10 M7 12h5"/></symbol></defs>
