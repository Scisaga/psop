<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">统一工作台、设备工作区与三技能</title>
  <desc id="diagram-description">统一工作台管理多个设备工作区。每个工作区对应一个设备，Build、Simulate、Compile 共享设备上下文，分别产出 DKP、场景与观测、数据集与模型。产物在工作区登记并通过版本引用关联，三技能复用通用执行能力。</desc>
  <defs>
    <filter id="panel-shadow" x="-10%" y="-20%" width="120%" height="145%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#174c48" flood-opacity=".055"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M1 1 6 4 1 7" fill="none" stroke="#83a39b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <!-- Brand geometry and colors from assets/brand/psop-mark.svg. -->
    <linearGradient id="brand-upper-fold" x1="409" y1="365" x2="593" y2="543" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A92B0D"/>
      <stop offset=".48" stop-color="#E83D12"/>
      <stop offset="1" stop-color="#FF4A24"/>
    </linearGradient>
    <linearGradient id="brand-upper-face" x1="817" y1="88" x2="409" y2="433" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF5126"/>
      <stop offset=".56" stop-color="#FF4A24"/>
      <stop offset="1" stop-color="#F23A15"/>
    </linearGradient>
    <linearGradient id="brand-lower-fold" x1="687" y1="337" x2="842" y2="460" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F5451C"/>
      <stop offset=".6" stop-color="#D4330E"/>
      <stop offset="1" stop-color="#A92B0D"/>
    </linearGradient>
    <linearGradient id="brand-lower-face" x1="851" y1="447" x2="488" y2="718" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF5126"/>
      <stop offset=".6" stop-color="#FF4A24"/>
      <stop offset="1" stop-color="#FF542B"/>
    </linearGradient>
    <symbol id="psop-brand" viewBox="0 0 1024 1024">
      <g transform="translate(-329 -35) scale(1.36)">
        <path fill="url(#brand-upper-fold)" d="M841 76 839 180C839 216 825 237 795 249L510 350C487 366 492 390 512 410L629 527 584 545 386 465C361 455 353 445 353 423 348 364 370 322 420 293Z"/>
        <path fill="url(#brand-upper-face)" d="M841 76 839 180C839 216 825 237 795 249L409 397C374 410 352 424 358 444 352 436 352 422 353 408 351 354 374 318 420 293Z"/>
        <path fill="url(#brand-lower-fold)" d="M677 331 836 375C871 387 886 398 886 415L883 482 803 461C782 432 756 411 684 373 679 370 677 369 677 363Z"/>
        <path fill="url(#brand-lower-face)" d="M886 408V478C886 515 870 536 837 554L469 735V600L840 445C871 432 886 421 886 408Z"/>
      </g>
    </symbol>
    <!--
      UI glyphs match lucide-react icons used by the workbench.
      ISC License
      Copyright (c) 2026 Lucide Icons and Contributors

      Permission to use, copy, modify, and/or distribute this software for any
      purpose with or without fee is hereby granted, provided that the above
      copyright notice and this permission notice appear in all copies.

      THE SOFTWARE IS PROVIDED "AS IS" AND THE AUTHOR DISCLAIMS ALL WARRANTIES
      WITH REGARD TO THIS SOFTWARE INCLUDING ALL IMPLIED WARRANTIES OF
      MERCHANTABILITY AND FITNESS. IN NO EVENT SHALL THE AUTHOR BE LIABLE FOR
      ANY SPECIAL, DIRECT, INDIRECT, OR CONSEQUENTIAL DAMAGES OR ANY DAMAGES
      WHATSOEVER RESULTING FROM LOSS OF USE, DATA OR PROFITS, WHETHER IN AN
      ACTION OF CONTRACT, NEGLIGENCE OR OTHER TORTIOUS ACTION, ARISING OUT OF
      OR IN CONNECTION WITH THE USE OR PERFORMANCE OF THIS SOFTWARE.
    -->
    <symbol id="icon-workspace" viewBox="0 0 24 24">
      <path d="M20 10a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1h-2.5a1 1 0 0 1-.8-.4l-.9-1.2A1 1 0 0 0 15 3h-2a1 1 0 0 0-1 1v5a1 1 0 0 0 1 1Z"/>
      <path d="M20 21a1 1 0 0 0 1-1v-3a1 1 0 0 0-1-1h-2.9a1 1 0 0 1-.88-.55l-.42-.85a1 1 0 0 0-.92-.6H13a1 1 0 0 0-1 1v5a1 1 0 0 0 1 1Z"/>
      <path d="M3 5a2 2 0 0 0 2 2h3"/>
      <path d="M3 3v13a2 2 0 0 0 2 2h3"/>
    </symbol>
    <symbol id="icon-build" viewBox="0 0 24 24">
      <rect x="3" y="3" width="8" height="8" rx="2"/>
      <path d="M7 11v4a2 2 0 0 0 2 2h4"/>
      <rect x="13" y="13" width="8" height="8" rx="2"/>
    </symbol>
    <symbol id="icon-simulate" viewBox="0 0 24 24">
      <path d="M5 3v16h16"/>
      <path d="m5 19 6-6"/>
      <path d="m2 6 3-3 3 3"/>
      <path d="m18 16 3 3-3 3"/>
    </symbol>
    <symbol id="icon-compile" viewBox="0 0 24 24">
      <path d="M14 2v6a2 2 0 0 0 .245.96l5.51 10.08A2 2 0 0 1 18 22H6a2 2 0 0 1-1.755-2.96l5.51-10.08A2 2 0 0 0 10 8V2"/>
      <path d="M6.453 15h11.094"/>
      <path d="M8.5 2h7"/>
    </symbol>
    <style>
      text { font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif; fill: #2b4145; }
      .muted { fill: #5e7375; }
      .accent { fill: #237d79; }
      .heading { font-weight: 650; }
      .line { fill: none; stroke: #b3cac3; stroke-width: 1.5; }
      .icon { fill: none; stroke: #347f78; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
      .card { fill: #fff; stroke: #dce8e3; stroke-width: 1.2; }
      .artifact { fill: #f0f7f4; stroke: #dbeae3; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1200" height="1000" fill="#fff"/>

  <!-- Application layer: a shared interface, rather than a Build artifact. -->
  <rect x="32" y="24" width="1136" height="110" rx="18" fill="#edf6f4" stroke="#cce0da" stroke-width="1.3" filter="url(#panel-shadow)"/>
  <use href="#psop-brand" x="54" y="48" width="54" height="54"/>
  <text x="124" y="70" font-size="29" class="heading">统一工作台</text>
  <text x="124" y="104" font-size="17" class="muted">设备切换 · 浏览查询 · 交互操作 · 作业与产物入口</text>
  <rect x="918" y="57" width="220" height="40" rx="20" fill="#fff" stroke="#cce0da"/>
  <text x="1028" y="83" text-anchor="middle" font-size="16" class="accent">管理多个设备工作区</text>

  <path d="M600 135v39" class="line" marker-end="url(#arrow)"/>
  <text x="616" y="160" font-size="14" class="muted">选择设备上下文</text>

  <!-- Business boundary: one device, shared identities and version references. -->
  <rect x="32" y="184" width="1136" height="640" rx="20" fill="#f8fbfa" stroke="#d4e4dd" stroke-width="1.3"/>
  <use href="#icon-workspace" x="56" y="199" width="32" height="32" class="icon"/>
  <text x="100" y="223" font-size="23" class="heading">设备工作区</text>
  <text x="1140" y="222" text-anchor="end" font-size="16" class="muted">一个设备的完整工作上下文</text>

  <rect x="56" y="244" width="1088" height="56" rx="10" fill="#fff" stroke="#e0eae5"/>
  <text x="78" y="279" font-size="16" class="heading accent">共同上下文</text>
  <path d="M196 258v28M454 258v28M738 258v28" stroke="#e0eae5"/>
  <text x="220" y="279" font-size="16" class="muted">设备身份与输入版本</text>
  <text x="478" y="279" font-size="16" class="muted">对象与来源定位</text>
  <text x="762" y="279" font-size="16" class="muted">任务状态与产物引用</text>
  <text x="56" y="325" font-size="14" class="muted">三类能力入口 · 同一套技能在不同设备上下文中复用</text>

  <!-- Build and its own deliverable. -->
  <g id="build-capability">
    <rect x="56" y="342" width="348" height="330" rx="12" class="card"/>
    <rect x="78" y="362" width="38" height="38" rx="9" fill="#edf6f1"/>
    <use href="#icon-build" x="84" y="368" width="26" height="26" class="icon"/>
    <text x="130" y="390" font-size="26" class="heading">Build</text>
    <text x="78" y="423" font-size="17">解析资料与核验知识</text>
    <text x="78" y="449" font-size="16" class="muted">固定来源、几何与装配依据</text>
    <path d="M230 464v25" class="line" marker-end="url(#arrow)"/>
    <text x="244" y="481" font-size="13" class="muted">产出</text>
    <rect x="76" y="500" width="308" height="148" rx="8" class="artifact"/>
    <text x="98" y="535" font-size="21" class="heading accent">DKP 设备知识包</text>
    <text x="98" y="568" font-size="16">知识 · 几何 · 证据</text>
    <text x="98" y="594" font-size="16">来源 · 索引 · 能力范围</text>
    <text x="98" y="627" font-size="14" class="muted">不可变知识快照</text>
  </g>

  <!-- Simulate and its own deliverables. -->
  <g id="simulate-capability">
    <rect x="426" y="342" width="348" height="330" rx="12" class="card"/>
    <rect x="448" y="362" width="38" height="38" rx="9" fill="#edf6f1"/>
    <use href="#icon-simulate" x="454" y="368" width="26" height="26" class="icon"/>
    <text x="500" y="390" font-size="26" class="heading">Simulate</text>
    <text x="448" y="423" font-size="17">装配与场景管理</text>
    <text x="448" y="449" font-size="16" class="muted">渲染观测、测试模型</text>
    <path d="M600 464v25" class="line" marker-end="url(#arrow)"/>
    <text x="614" y="481" font-size="13" class="muted">产出</text>
    <rect x="446" y="500" width="308" height="148" rx="8" class="artifact"/>
    <text x="468" y="535" font-size="21" class="heading accent">场景、观测与报告</text>
    <text x="468" y="568" font-size="16">配置 · 会话 · 渲染批次</text>
    <text x="468" y="594" font-size="16">模型测试报告 · 纠错候选</text>
    <text x="468" y="627" font-size="14" class="muted">独立的场景版本与运行记录</text>
  </g>

  <!-- Compile and its own deliverables. -->
  <g id="compile-capability">
    <rect x="796" y="342" width="348" height="330" rx="12" class="card"/>
    <rect x="818" y="362" width="38" height="38" rx="9" fill="#edf6f1"/>
    <use href="#icon-compile" x="824" y="368" width="26" height="26" class="icon"/>
    <text x="870" y="390" font-size="26" class="heading">Compile</text>
    <text x="818" y="423" font-size="17">语料与数据集管理</text>
    <text x="818" y="449" font-size="16" class="muted">训练、登记与评测模型</text>
    <path d="M970 464v25" class="line" marker-end="url(#arrow)"/>
    <text x="984" y="481" font-size="13" class="muted">产出</text>
    <rect x="816" y="500" width="308" height="148" rx="8" class="artifact"/>
    <text x="838" y="535" font-size="21" class="heading accent">数据集、模型与评测</text>
    <text x="838" y="568" font-size="16">语料 · 数据集 · 模型版本</text>
    <text x="838" y="594" font-size="16">训练实验 · 评测记录</text>
    <text x="838" y="627" font-size="14" class="muted">独立于 DKP 的研发产物</text>
  </g>

  <!-- Outputs are registered in the device context, not packed back into DKP. -->
  <path d="M230 672v34M600 672v34M970 672v34" class="line"/>
  <rect x="56" y="708" width="1088" height="92" rx="10" fill="#eaf3ef" stroke="#d4e4dc"/>
  <text x="80" y="744" font-size="20" class="heading">工作区统一登记与引用各类产物</text>
  <text x="80" y="777" font-size="16" class="muted">独立版本化 · 输入与输出可追踪 · 由工作台统一组织、检索、展示与交互</text>

  <!-- Shared execution capabilities are reused across device workspaces. -->
  <rect x="32" y="850" width="1136" height="94" rx="12" fill="#f5f7f7" stroke="#e0e7e6"/>
  <text x="56" y="884" font-size="19" class="heading">三技能共用的执行能力</text>
  <text x="56" y="915" font-size="15" class="muted">按设备上下文调用</text>
  <path d="M328 869v56" stroke="#dce5e3"/>
  <text x="354" y="884" font-size="17">知识解析与验证</text>
  <text x="592" y="884" font-size="17">几何 · 约束 · 渲染</text>
  <text x="864" y="884" font-size="17">训练 · 推理 · 模型运行</text>
  <text x="354" y="915" font-size="15" class="muted">技能负责编排，对应执行器完成计算，工作台呈现交互与结果。</text>

  <text x="36" y="979" font-size="14" class="muted">产品组织结构示意 · 三种能力按任务独立调用 · 实际接入状态见当前能力表</text>
</svg>
