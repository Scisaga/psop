<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850" viewBox="0 0 1440 850" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">PSOP 三个正式生产环节逻辑架构</title>
<desc id="figure-desc">原始材料经 psop@build 形成 build-profile DKP，再由 psop@compile 形成同一 package_id 的 compile-profile DKP。EG 只表达设备任务 SOP；训练语料独立管理，在数据侧引用 SOP。compile 内部使用 Codex 生成候选场景程序，并由 headless 确定性 kernel 与验证器产生真值、轨迹和训练监督，训练和评测 Qwen-ASR、YOLO、RelateAnything、MiniCPM-V 4.6。模型导出到终端，以照片和提问提供无 EG 的现场帮助，物理动作由操作者完成，不直接控制真实硬件。psop@simulate 只读消费冻结的 compile 快照，生成 DKP 之外的 Web 3D 沙盒，面向用户与可选 Codex Agent，并把 compile 发布的设备模型推理作为沙盒内建逻辑能力。headless 和沙盒中的 EG 验证不构成终端模型的运行依赖。运行反馈只能作为后续独立 revision 的候选输入，不能原地改写冻结 DKP。</desc>
