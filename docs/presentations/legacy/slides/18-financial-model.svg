<g id="title"><text x="64" y="98" dominant-baseline="hanging" font-size="52" fill="#183132" font-weight="700" data-max-width="1472" >3 年目标：收入过亿，订阅支撑持续经营</text><text x="64" y="176" dominant-baseline="hanging" font-size="24" fill="#506D64" font-weight="400" data-max-width="1472" >收入、成本、交付与续费来自同一模型；集团大单和市场佣金未入模，经营贡献不是净利润。</text></g>
