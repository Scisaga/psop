 fill="#183132" /><rect x="1061" y="235" width="475" height="384" rx="16" fill="url(#deck-grid-dark)" opacity=".25"/><text x="1088" y="258" dominant-baseline="hanging" font-size="19" fill="#C5DED2" font-weight="500" data-max-width="420" >第 3 年年度收入</text><text x="1088" y="300" dominant-baseline="hanging" font-size="52" fill="#D0FF71" font-weight="700" data-max-width="420" >1.68 亿</text><text x="1088" y="389" dominant-baseline="hanging" font-size="32" fill="#FFFFFF" font-weight="700" data-max-width="190" >69%</text><text x="1300" y="389" dominant-baseline="hanging" font-size="32" fill="#FFFFFF" font-weight="700" data-max-width="212" >1.91 亿</text><text x="1088" y="438" dominant-baseline="hanging" font-size="17" fill="#C5DED2" font-weight="500" data-max-width="187" >订阅占比</text><text x="1300" y="438" dominant-baseline="hanging" font-size="17" fill="#C5DED2" font-weight="500" data-max-width="212" >期末 ARR</text><line x1="1088" y1="476" x2="1508" y2="476" stroke="#3A6D61" stroke-width="2"/><text x="1088" y="498" dominant-baseline="hanging" font-size="19" fill="#FFFFFF" font-weight="600" data-max-width="420" >订阅独立覆盖固定开支</text><text x="1088" y="536" dominant-baseline="hanging" font-size="21" fill="#D0FF71" font-weight="700" data-max-width="420" >6,500 ÷ 75% ≈ 8,667 万</text><text x="1088" y="579" dominant-baseline="hanging" font-size="15" fill="#C5DED2" font-weight="500" data-max-width="420" >全年确认口径 · ARR 不是当年收入</text></g><g id="beat_03"><text x="64" y="643" dominant-baseline="hanging" font-size="25" fill="#183132" font-weight="600" data-max-width="375" >第 3 年情景对照</text><text x="443" y="646" dominant-baseline="hanging" font-size="22" fill="#506D64" font-weight="400" data-max-width="1070" >收入 / 经营贡献；基于假设的情景测算</text><rect x="64" y="690" width="1472" height="124" rx="16" fill="#E2F3EA" /><rect x="64" y="690" width="1472" height="124" rx="16" fill="url(#deck-grid)" opacity=".30"/><text x="88" y="706" dominant-baseline="hanging" font-size="25" fill="#004D43" font-weight="600" data