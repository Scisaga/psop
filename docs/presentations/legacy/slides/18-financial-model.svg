<title id="slide-title">3 年目标：年收入过亿，订阅支撑持续经营</title><desc id="slide-desc">第 3 年约 1.68 亿元收入与约 4,037 万元经营贡献来自同一套获客、续费和成本假设；同时展示订阅平衡点和不达目标的结果。</desc><metadata>{&quot;source_page&quot;:18,&quot;source_sha256&quot;:&quot;cd3a9baf6c498287b8dc56ec1cb00cd6f173d80ac324d9c6cafdaced3987fd26&quot;,&quot;narration_sha256&quot;:&quot;d1cb3278b84ca3287b0ca8c412f486aa114e9f10b07cdd8157d69f956a4cd60f&quot;,&quot;narration&quot;:&quot;这套模型的规模化目标是第 1 年 1,000 万元收入、第 2 年 4,580 万元、第 3 年约 1.68 亿元。第 3 年订阅收入 11,622 万元，项目收入 5,200 万元，订阅占比约 69%，期末 ARR 约 1.91 亿元；ARR 不是当年收入。扣除直接成本与 6,500 万元固定经营投入，经营贡献约 4,037 万元，前两年则分别为 −706 万和 −565 万。经营贡献是税费、折旧摊销与融资前口径，不是净利润。若订阅毛利率达到 75%，约 8,667 万元全年确认的订阅收入可以独立覆盖上述固定开支。我们同时保留未达目标的路径：落地型第 3 年收入 6,097 万元，经营贡献仍为 −501 万；突破型收入 33,777 万元、经营贡献 10,862 万元，但需要更大的获客、交付与研发投入。三种情景不是概率预测，也不是已有订单支持的预测；要持续验证的仍然是成交、续费、支持人日、项目交付和回款。本模型没有依靠集团大单、硬件收入或市场佣金。&quot;,&quot;visual_sources&quot;:[]}</metadata>
