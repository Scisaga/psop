<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="slide-title slide-desc">
<title id="slide-title">开源让用户自己用起来，商业服务支持企业规模化使用</title><desc id="slide-desc">开源建立采用与信任，商业版围绕组织管理、运维和服务收费；不通过强迫公开来制造付费需求。</desc><metadata>{&quot;source_page&quot;:14,&quot;source_sha256&quot;:&quot;d1d52a2d4ac4a6dfb5ad5dcc8b8069238c0c3f619b72da6f409504a56c751a93&quot;,&quot;narration_sha256&quot;:&quot;0f9dc468dd1f22f05615a8067953e9fb5f91357ede8dfdc33d708867c9ed402c&quot;,&quot;narration&quot;:&quot;我们的分层分成开源自助、开放社区和商业服务。开源用户自带算力和模型，可以自己构建、测试、部署与分发，也可以只在内部使用。我们鼓励用户把有权公开的技能和模型包贡献到社区，但不要求公开原始资料或全部产物。企业选择付费，是因为需要多人协作、受管版本发布、权限审计、稳定运维和持续支持。商业版也可以使用客户自己的算力。这借鉴了 RustDesk 开源核心与商业集中管理的分层思路，但收费对象和产品边界按设备技能业务设计；现有开源能力不会被重新包装成必须购买的保密权。&quot;,&quot;visual_sources&quot;:[]}</metadata>
