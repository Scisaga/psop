<g id="title"><text x="64" y="98" dominant-baseline="hanging" font-size="52" fill="#183132" font-weight="700" data-max-width="1472" >开源让用户用起来，商业服务支持规模化使用</text><text x="64" y="176" dominant-baseline="hanging" font-size="24" fill="#506D64" font-weight="400" data-max-width="1472" >借鉴开源核心与商业管理分层：用采用和信任建立入口，用企业服务完成收入闭环。</text></g>
<g id="beat_01"><rect x="64" y="245" width="1472" height="489" rx="16" fill="#F8FFFB" stroke="#C5DED2" stroke-width="1.5" /><rect x="64" y="245" width="1472" height="489" rx="16" fill="url(#deck-grid)" opacity=".30"/><defs><clipPath id="commercial-matrix"><rect x="64" y="245" width="1472" height="489" rx="16" fill="white" /></clipPath></defs><g clip-path="url(#commercial-matrix)"><rect x="64" y="245" width="1472" height="63" rx="0" fill="#004D43" /><text x="90" y="266" dominant-baseline="hanging" font-size="24" fill="#FFFFFF" font-weight="600" data-max-width="230" >层次</text><text x="350" y="266" dominant-baseline="hanging" font-size="24" fill="#FFFFFF" font-weight="600" data-max-width="650" >用户获得什么</text><text x="1068" y="266" dominant-baseline="hanging" font-size="24" fill="#FFFFFF" font-weight="600" data-max-width="430" >费用与责任</text><rect x="64" y="308" width="1472" height="142" rx="0" fill="#F8FFFB" /><rect x="64" y="308" width="1472" height="142" rx="0" fill="url(#deck-grid)" opacity=".30"/><text x="90" y="360" dominant-baseline="hanging" font-size="30" fill="#004D43" font-weight="600" data-max-width="238" >开源自助</text><text x="350" y="344" dominant-baseline="hanging" font-size="24" fill="#183132" font-weight="500" data-max-width="687" >自带算力，自己构建、测试、部署与基本分发</text><text x="350" y="396" dominant-baseline="hanging" font-size="22" fill="#506D64" font-weight="400" data-max-width="687" >核心开放，完整工具链逐步建设</text><text x="1068" y="344" dominant-baseline="hanging" font-size="24" fill="#004D43" font-weight="600" data-max-width="438" >免费软件 · 自行运维</text><text x="1068" y="396" dominant-baseline="hanging" font-size="22" fill="#506D64" font-weight="400" data-max-width="438" >可以私有自用</text><line x1="64" y1="450" x2="1536" y2="450" stroke="#C5DED2" stroke-width="2"/><rect x="64" y="450" width="1472" height="142" rx="0" fill="#FFFFFF" /><text x="90" y="502" dominant-baseline="hanging" font-size="30" fill="#004D43" font-weight="600" data-max-width="238" >开放社区</text><text x="350" y="486" dominant-baseline="hanging" font-size="24" fill="#183132" font-weight="500" data-max-width="687" >发现、安装、分享 PSkill 与端侧模型包</text><text x="350" y="538" dominant-baseline="hanging" font-size="22" fill="#506D64" font-weight="400" data-max-width="687" >来源、许可、兼容性与测试范围透明</text><text x="1068" y="486" dominant-baseline="hanging" font-size="24" fill="#004D43" font-weight="600" data-max-width="438" >公开可选 · 作者授权</text><text x="1068" y="538" dominant-baseline="hanging" font-size="22" fill="#506D64" font-weight="400" data-max-width="438" >鼓励贡献，不要求上传原始资料</text><line x1="64" y1="592" x2="1536" y2="592" stroke="#C5DED2" stroke-width="2"/><rect x="64" y="592" width="1472" height="142" rx="0" fill="#E2F3EA" /><rect x="64" y="592" width="1472" height="142" rx="0" fill="url(#deck-grid)" opacity=".30"/><text x="90" y="644" dominant-baseline="hanging" font-size="30" fill="#004D43" font-weight="600" data-max-width="238" >商业服务</text><text x="350" y="628" dominant-baseline="hanging" font-size="24" fill="#183132" font-weight="500" data-max-width="687" >受管注册表、组织治理、批量发布、支持与适配</text><text x="350" y="680" dominant-baseline="hanging" font-size="22" fill="#506D64" font-weight="400" data-max-width="687" >保密不是收费理由；付费购买管理与持续服务</text><text x="1068" y="628" dominant-baseline="hanging" font-size="24" fill="#004D43" font-weight="600" data-max-width="438" >订阅 + 项目服务</text><text x="1068" y="680" dominant-baseline="hanging" font-size="22" fill="#506D64" font-weight="400" data-max-width="438" >企业仍可使用自己的算力</text><line x1="323" y1="308" x2="323" y2="734" stroke="#C5DED2" stroke-width="2"/><line x1="1042" y1="308" x2="1042" y2="734" stroke="#C5DED2" stroke-width="2"/></g></g><g id="beat_02"><rect x="64" y="742" width="1472" height="64" rx="12" fill="#E2F3EA" /><text x="88" y="762" dominant-baseline="hanging" font-size="25" fill="#004D43" font-weight="600" data-max-width="1424" >公开可选 · 私有自用可行 · 企业为管理与服务付费</text></g>
