th="190" >万元 / 年</text><text x="92" y="496" dominant-baseline="hanging" font-size="23" fill="#183132" font-weight="400" data-max-width="640" >人工及用工运营负担  2,700 万</text><text x="92" y="532" dominant-baseline="hanging" font-size="23" fill="#506D64" font-weight="400" data-max-width="640" >差旅  1,500 万</text><rect x="92" y="575" width="416" height="16" rx="4" fill="#004D43" /><rect x="508" y="575" width="231" height="16" rx="4" fill="#E2F3EA" /><text x="92" y="609" dominant-baseline="hanging" font-size="20" fill="#506D64" font-weight="400" data-max-width="650" >其中 3,750 万纳入工序改善分析，不与预算相加</text></g><g id="beat_03"><rect x="800" y="324" width="736" height="316" rx="18" fill="#F8FFFB" stroke="#004D43" stroke-width="1.5" /><rect x="800" y="324" width="736" height="316" rx="18" fill="url(#deck-grid)" opacity=".30"/><text x="828" y="348" dominant-baseline="hanging" font-size="26" fill="#183132" font-weight="600" data-max-width="680" >成熟运行：潜在降本增效价值</text><rect x="824" y="391" width="670" height="84" rx="10" fill="#D0FF71" /><text x="842" y="398" dominant-baseline="hanging" font-size="70" fill="#004D43" font-weight="700" data-max-width="260" >1,114</text><text x="1110" y="436" dominant-baseline="hanging" font-size="25" fill="#004D43" font-weight="500" data-max-width="170" >万元 / 年</text><rect x="1324" y="415" width="154" height="36" rx="9" fill="#FFFFFF" /><text x="1338" y="422" dominant-baseline="hanging" font-size="22" fill="#004D43" font-weight="500" data-max-width="126" >约占 27%</text><text x="828" y="497" dominant-baseline="hanging" font-size="23" fill="#004D43" font-weight="600" data-max-width="660" >375 万  可取消差旅</text><text x="828" y="533" dominant-baseline="hanging" font-size="23" fill="#506D64" font-weight="500" data-max-width="660" >739 万  释放工时产能</text><rect x="828" y="575" width="224" height="16" rx="4" fill="#004D43" /><rect x="1052" y="575" width="440" height="16" rx="4" fill="#E2F3EA" /><text x="828" y="609" dominant-baseline="hanging" font-size="20" fill="#506D64" font-weight="400" data-max-width="678" >改善区间 867–1,356 万 / 年 · 未扣项目投入</text></g><g id="beat_04"><rect x="64" y="674" width="1472" height="132" rx="16" fill="#183132" /><rect x="64" y="674" width="1472" height="132" rx="16" fill="url(#deck-grid-dark)" opacity=".25"/><rect x="88" y="696" width="272" height="36" rx="9" fill="#D0FF71" /><text x="102" y="703" dominant-baseline="hanging" font-size="22" fill="#004D43" font-weight="500" data-max-width="244" >假设 3,000 家同类企业</text><text x="398" y="699" dominant-baseline="hanging" font-size="34" fill="#FFFFFF" font-weight="600" data-max-width="280" >1,260 亿元</text><text x="689" y="708" dominant-baseline="hanging" font-size="22" fill="#C5DED2" font-weight="400" data-max-width="250" >年度服务预算</text><text x="1014" y="699" dominant-baseline="hanging" font-size="34" fill="#D0FF71" font-weight="600" data-max-width="240" >334 亿元</text><text x="1260" y="708" dominant-baseline="hanging" font-size="22" fill="#C5DED2" font-weight="400" data-max-width="240" >潜在改善</text><text x="90" y="761" dominant-baseline="hanging" font-size="22" fill="#C5DED2" font-weight="400" data-max-width="1418" >仅厂商一侧；使用方新增人工另核。不代表行业损失，不是 PSOP 收入。</text></g>
