<title id="slide-title">一个百人服务网络，背后是数千万元的年度支出</title><desc id="slide-desc">面向跨区域设备厂商，PSOP 对应的是数千万元服务预算中的效率问题，而不只是一个客服工具；客户规模和可改善工序必须同时讲清。</desc><metadata>{&quot;source_page&quot;:2,&quot;source_sha256&quot;:&quot;d1d52a2d4ac4a6dfb5ad5dcc8b8069238c0c3f619b72da6f409504a56c751a93&quot;,&quot;narration_sha256&quot;:&quot;79960bd4a30848a13b19b677b6f161f006ff8ffe5ad984f1d8f205bfb79fc9ef&quot;,&quot;narration&quot;:&quot;对拥有跨区域服务网络的设备厂商，问题不只是客服多接几个电话。我们按 100 个服务全职当量、每年 4 万次远程支持和 1 万次出勤测算，人工及用工运营负担约 2,700 万元，差旅约 1,500 万元，合计 4,200 万元。这是高复杂度商用设备企业的情景，不是小型机器人团队的平均成本。若原有远程工时减少 40%，25% 出勤能够安全地转为远程解决，保留上门的现场作业工时减少 15%，培训和知识维护工时减少 40%，扣回新增远程指导后，每年可释放约 1,100 万元价值。其中 375 万元是差旅，其余是工时产能。若有 3,000 家同类企业，就是 1,000 亿元级服务预算、300 亿元级改善空间。这是厂商一侧的账，使用方新增操作成本要另核，不能把费用转移当作全产业节约；客户停机和 AI 新品交付收益也未计入。它是待验证的价值情景，不是保证节约，更不是 PSOP 的收入。&quot;,&quot;visual_sources&quot;:[]}</metadata>
