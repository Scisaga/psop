<g id="title"><text x="64" y="98" dominant-baseline="hanging" font-size="52" fill="#183132" font-weight="700" data-max-width="1472" >从 1 款设备的试点，验证可复制的增长</text><text x="64" y="176" dominant-baseline="hanging" font-size="24" fill="#506D64" font-weight="400" data-max-width="1472" >12 个月，让交付可验收、客户账算得通、外部团队能够独立复用。</text></g>
