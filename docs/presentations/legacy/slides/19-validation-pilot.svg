<title id="slide-title">从 1 款设备的试点，验证可复制的增长</title><desc id="slide-desc">把客户可验收的试点、完整投入产出和 12 个月商业里程碑放在同一条路径中：只有效果、成本与复用都成立，才扩大规模。</desc><metadata>{&quot;source_page&quot;:19,&quot;source_sha256&quot;:&quot;d1d52a2d4ac4a6dfb5ad5dcc8b8069238c0c3f619b72da6f409504a56c751a93&quot;,&quot;narration_sha256&quot;:&quot;b33e0bcaac77872e3ea5afdc2f264443d5f068d5b092f0616d6e09658d3e770f&quot;,&quot;narration&quot;:&quot;接下来从一个能验收的试点开始：1 款设备、3–5 项任务、1 组手机和 1 款 AR 眼镜，先确认资料授权、BOM、允许操作与当前工时基线，再交付技能、模型和终端配置。手机磁吸工位与 AR 分别测试，质量、安全、体验和成本都说得通，才扩展到更多任务与网点；也可以停止或修订。客户是否愿意长期付费，要看完整的账，而不是一张节约大数字。沿用 100 人企业情景，首年订阅 120 万、实施 80 万、算力运营 40 万、AR 硬件配套 40 万，共 280 万元。按首年 60% 稳态覆盖、工时 50% 有效利用，净经济价值约 167 万元，稳态约 576 万元；若只认差旅节省，首年仍差 55 万、稳态约结余 207 万。这不是试点报价，也不保证首年现金回本。未来 12 个月按交付链路、独立复用、商业采用三阶段推进，企业采购同步开展。第 1 年目标是 2,000 个激活组织、200 个专业订阅、10 个团队和 3 个企业客户。按 60 天应收测算，3 年年度现金代理的最大累计缺口约 2,254 万元，加缓冲约 2,818 万元，是资金准备讨论量级，不是已决定融资额。第 3 年经营转正也不代表此前累计投入已经收回。最终用真实运行、真实付费与回款，验证设备技能基础设施能否规模化成立。&quot;,&quot;visual_sources&quot;:[]}</metadata>
