<text x="88" y="414" dominant-baseline="hanging" font-size="27" fill="#183132" font-weight="600" data-max-width="642" >一站试点：共同准备、交付与验收</text><text x="88" y="465" dominant-baseline="hanging" font-size="26" fill="#004D43" font-weight="600" data-max-width="643" >1 款设备 · 3–5 项任务 · 1 组手机 · 1 款 AR</text><text x="88" y="524" dominant-baseline="hanging" font-size="27" fill="#004D43" font-weight="600" data-max-width="194" >准备</text><text x="88" y="565" dominant-baseline="hanging" font-size="22" fill="#506D64" font-weight="400" data-max-width="195" >授权资料 / BOM</text><text x="88" y="599" dominant-baseline="hanging" font-size="22" fill="#506D64" font-weight="400" data-max-width="195" >工时与质量基线</text><line x1="204" y1="538" x2="286" y2="538" stroke="#004D43" stroke-width="2.5"/><path d="M278.10175694298664,542.3148298474379 L286,538 L278.10175694298664,533.6851701525621" fill="none" stroke="#004D43" stroke-width="2.5" stroke-linecap="round"/><text x="310" y="524" dominant-baseline="hanging" font-size="27" fill="#004D43" font-weight="600" data-max-width="194" >交付</text><text x="310" y="565" dominant-baseline="hanging" font-size="22" fill="#506D64" font-weight="400" data-max-width="195" >PSkill / 模型</text><text x="310" y="599" dominant-baseline="hanging" font-size="22" fill="#506D64" font-weight="400" data-max-width="195" >终端配置与规则</text><line x1="426" y1="538" x2="508" y2="538" stroke="#004D43" stroke-width="2.5"/><path d="M500.10175694298664,542.3148298474379 L508,538 L500.10175694298664,533.6851701525621" fill="none" stroke="#004D43" stroke-width="2.5" stroke-linecap="round"/><text x="532" y="524" dominant-baseline="hanging" font-size="27" fill="#004D43" font-weight="600" data-max-width="194" >验收</text><text x="532" y="565" dominant-baseline="hanging" font-size="22" fill="#506D64" font-weight="400" data-max-width="195" >任务质量 / 安全</text><text x="532" y="599" dominant-baseline="hanging" font-size="22" fill="#506D64" font-weight="400" data-max-width="195" >双端体验 / 工时</text><rect x="88" y="652" width="641" height="34" rx="8" fill="#E2F3EA" /><text x="108" y="659" dominant-baseline="hanging" font-size="21" fill="#004D43" font-weight="600" data-max-width="600" >按结果决定：停止 / 修订 / 扩展</text><rect x="786" y="395" width="750" height="308" rx="16" fill="#FFFFFF" stroke="#C5DED2" stroke-width="1.5" /><text x="810" y="414" dominant-baseline="hanging" font-size="27" fill="#183132" font-weight="600" data-max-width="700" >企业部署 ROI 情景 · 非试点报价</text><text x="810" y="457" dominant-baseline="hanging" font-size="22" fill="#555ABD" font-weight="600" data-max-width="700" >首年 60% 覆盖 · 工时 50% 有效利用</text><text x="1286" y="494" dominant-baseline="hanging" font-size="21" fill="#506D64" font-weight="600" data-max-width="130" text-anchor="end">首年</text><text x="1508" y="494" dominant-baseline="hanging" font-size="21" fill="#506D64" font-weight="600" data-max-width="193" text-anchor="end">稳态年度</text><text x="810" y="532" dominant-baseline="hanging" font-size="22" fill="#183132" font-weight="400" data-max-width="324" >经济价值</text><text x="1286" y="532" dominant-baseline="hanging" font-size="25" fill="#004D43" font-weight="600" data-max-width="162" text-anchor="end">447</text><text x="1508" y="532" dominant-baseline="hanging" font-size="25" fill="#004D43" font-weight="600" data-max-width="184" text-anchor="end">744</text><text x="810" y="569" dominant-baseline="hanging" font-size="22" fill="#183132" font-weight="400" data-max-width="324" >投入</text><text x="1286" y="569" dominant-baseline="hanging" font-size="25" fill="#004D43" font-weight="600" data-max-width="162" text-anchor="end">280</text><text x="1508" y="569" dominant-baseline="hanging" font-size="25" fill="#004D43" font-weight="600" data-max-width="184" text-anchor="end">168</text><rect x="802" y="602" width="718" height="35" rx="7" fill="#E2F3EA" /><text x="810" y="606" dominant-baseline="hanging" font-size="22" fill="#183132" font-weight="600" data-max-width="324" >净经济价值</text><text x="1286" y="606" dominant-baseline="hanging" font-size="25" fill="#004D43" font-weight="600" data-max-width="162" text-anchor="end">167</text><text x="1508" y="606" dominant-baseline="hanging" font-size="25" fill="#004D43" font-weight="600" data-max-width="184" text-anchor="end">576</text><text x="810" y="643" dominant-baseline="hanging" font-size="22" fill="#183132" font-weight="600" data-max-width="324" >仅差旅抵投入</text><text x="1286" y="643" dominant-baseline="hanging" font-size="25" fill="#AF493D" font-weight="600" data-max-width="162" text-anchor="end">−55</text><text x="1508" y="643" dominant-baseline="hanging" font-size="25" fill="#004D43" font-weight="600" data-max-width="184" text-anchor="end">+207</text><text x="810" y="681" dominant-baseline="hanging" font-size="18" fill="#506D64" font-weight="400" data-max-width="700" >单位：万元 · 首年投入 120 + 80 + 40 + 40 = 280</text></g><g id="beat_03"><rect x="64" y="731" width="1472" height="80" rx="16" fill="#183132" /><text x="88" y="759" dominant-baseline="hanging" font-size="22" fill="#C5DED2" font-weight="500" data-max-width="168" >第 1 年目标</text><line x1="280" y1="746" x2="280" y2="796" stroke="#3A6D61" stroke-width="2"/><text x="455" y="754" dominant-baseline="hanging" font-size="30" fill="#D0FF71" font-weight="600" data-max-width="260" text-anchor="middle">2,000 激活</text><text x="757" y="754" dominant-baseline="hanging" font-size="30" fill="#D0FF71" font-weight="600" data-max-width="260" text-anchor="middle">200 专业</text><text x="1059" y="754" dominant-baseline="hanging" font-size="30" fill="#D0FF71" font-weight="600" data-max-width="260" text-anchor="middle">10 团队</text><text x="1361" y="754" dominant-baseline="hanging" font-size="30" fill="#D0FF71" font-weight="600" data-max-width="260" text-anchor="middle">3 企业</text></g>
