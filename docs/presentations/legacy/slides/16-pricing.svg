dominant-baseline="hanging" font-size="17" fill="#C5DED2" font-weight="600" data-max-width="150" text-anchor="end">ENTERPRISE</text><text x="590" y="388" dominant-baseline="hanging" font-size="64" fill="#D0FF71" font-weight="700" data-max-width="200" >120</text><text x="786" y="424" dominant-baseline="hanging" font-size="24" fill="#FFFFFF" font-weight="500" data-max-width="222" >万元 / 年</text><line x1="590" y1="474" x2="1010" y2="474" stroke="#43776B" stroke-width="2"/><text x="590" y="497" dominant-baseline="hanging" font-size="22" fill="#FFFFFF" font-weight="400" data-max-width="420" >100 名前线人员 / 20 个产品族</text><text x="590" y="532" dominant-baseline="hanging" font-size="22" fill="#FFFFFF" font-weight="400" data-max-width="420" >10,000 台受管设备</text><text x="590" y="567" dominant-baseline="hanging" font-size="22" fill="#FFFFFF" font-weight="400" data-max-width="420" >多站点、审计、回滚与约定响应</text><rect x="1064" y="317" width="472" height="304" rx="18" fill="#F8FFFB" stroke="#C5DED2" stroke-width="1.5" /><rect x="1064" y="317" width="472" height="304" rx="18" fill="url(#deck-grid)" opacity=".30"/><text x="1090" y="339" dominant-baseline="hanging" font-size="29" fill="#183132" font-weight="600" data-max-width="310" >集团 / OEM</text><text x="1508" y="347" dominant-baseline="hanging" font-size="17" fill="#506D64" font-weight="600" data-max-width="150" text-anchor="end">GROUP</text><text x="1090" y="388" dominant-baseline="hanging" font-size="64" fill="#004D43" font-weight="700" data-max-width="200" >300</text><text x="1286" y="424" dominant-baseline="hanging" font-size="24" fill="#506D64" font-weight="500" data-max-width="222" >万元 / 年起</text><line x1="1090" y1="474" x2="1510" y2="474" stroke="#C5DED2" stroke-width="2"/><text x="1090" y="497" dominant-baseline="hanging" font-size="22" fill="#183132" font-weight="400" data-max-width="420" >1,000 名前线人员及多事业部</text><text x="1090" y="532" dominant-baseline="hanging" font-size="22" fill="#183132" font-weight="400" data-max-width="420" >OEM 适配与约定服务范围</text><text x="1090" y="567" dominant-baseline="hanging" font-size="22" fill="#183132" font-weight="400" data-max-width="420" >单独报价，未计入 3 年收入</text></g><g id="beat_03"><rect x="64" y="647" width="1472" height="80" rx="12" fill="#F8FFFB" stroke="#C5DED2" stroke-width="1.5" /><text x="88" y="665" dominant-baseline="hanging" font-size="25" fill="#183132" font-weight="600" data-max-width="430" >实施 / 定制 / 模型适配</text><text x="554" y="663" dominant-baseline="hanging" font-size="30" fill="#004D43" font-weight="600" data-max-width="480" >30–200 万元 / 项目</text><text x="1081" y="668" dominant-baseline="hanging" font-size="23" fill="#506D64" font-weight="400" data-max-width="420" >模型按 80 万元均价</text><text x="88" y="701" dominant-baseline="hanging" font-size="18" fill="#506D64" font-weight="400" data-max-width="1410" >算力、AR 硬件、新增适配按约定另计；以上为待验证的未税价格，不是已成交报价。</text></g><g id="beat_04"><rect x="64" y="750" width="1472" height="56" rx="10" fill="#E2F3EA" /><text x="86" y="767" dominant-baseline="hanging" font-size="24" fill="#004D43" font-weight="500" data-max-width="1420" >行业参照：100 人国际现场服务软件，标价折合约 88–147 万元 / 年</text></g>
