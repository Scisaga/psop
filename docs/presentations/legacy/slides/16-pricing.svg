</g><text x="108" y="34" dominant-baseline="hanging" font-size="24" fill="#183132" font-weight="700" data-max-width="100" >PSOP</text><text x="207" y="38" dominant-baseline="hanging" font-size="17" fill="#506D64" font-weight="500" data-max-width="800" >Physical Standard Operation Procedure</text><text x="1536" y="39" dominant-baseline="hanging" font-size="18" fill="#506D64" font-weight="400" data-max-width="550" text-anchor="end">拟议价格 · 待验证</text><line x1="64" y1="839" x2="1536" y2="839" stroke="#C5DED2" stroke-width="2"/><text x="64" y="855" dominant-baseline="hanging" font-size="16" fill="#506D64" font-weight="400" data-max-width="1350" >外部参照：Microsoft / Salesforce 官方 Field Service 标价；按 7 元/美元测算，非即时报价或同功能替代。</text><text x="1536" y="853" dominant-baseline="hanging" font-size="18" fill="#506D64" font-weight="500" data-max-width="100" text-anchor="end">16 / 19</text></g>
<g id="title"><text x="64" y="98" dominant-baseline="hanging" font-size="52" fill="#183132" font-weight="700" data-max-width="1472" >企业按管理规模付费，年费进入 100 万元级</text><text x="64" y="176" dominant-baseline="hanging" font-size="24" fill="#506D64" font-weight="400" data-max-width="1472" >开源自用免费。企业为治理、规模化发布、约定支持和定制适配付费。</text></g>
