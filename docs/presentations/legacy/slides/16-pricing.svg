<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="slide-title slide-desc">
<title id="slide-title">按企业管理规模收费，核心年费进入数十万至百万元级</title><desc id="slide-desc">小团队保留低门槛，企业为跨产品、跨终端、跨网点的持续治理付费；订阅价格应对应服务责任和可验证的业务价值。</desc><metadata>{&quot;source_page&quot;:16,&quot;source_sha256&quot;:&quot;c83cd5c72dd8f63e25667cc2aa6cc6799864d7e31f16f412da1399137d71353c&quot;,&quot;narration_sha256&quot;:&quot;e2acca80bb12658eab5068a05d78b479a9f7e83a8ae16916692ad7d0fbba29f9&quot;,&quot;narration&quot;:&quot;收费要跟企业真正管理的规模走。开源自助继续免费，小型 AI 硬件团队可以每年 6,000 元购买轻量托管。单事业部建议从每年 24 万元切入，跨区域企业标准档建议每年 120 万元，集团级从 300 万元起按责任范围谈。作为预算参照，按公开标价和 7 元兑 1 美元的测算换算，100 名用户的 Microsoft 和 Salesforce 现场服务基础软件，年费约 88 万–147 万元；AI 或视觉协作还可能另购。这说明企业级服务管理存在 100 万元级预算，但不证明 PSOP 已经有同样功能或客户愿付。我们的价格还要由技能资产、发布规模、手机与 AR 的执行效果来支撑。实施、建模和适配单独验收，常规项目 30 万–200 万元，经营模型按 80 万元均价。免费自建仍能保留私有资产，付费购买的是持续管理和服务，不是保密权。&quot;,&quot;visual_sources&quot;:[]}</metadata>
