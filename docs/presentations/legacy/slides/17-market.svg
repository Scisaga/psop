<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="slide-title slide-desc">
<title id="slide-title">市场空间，从国内验证走向全球复制</title><desc id="slide-desc">国内市场提供可核验的起点，但不是增长边界；先在国内验证产品与交付，再配合国内装备和技术出海，对接共建“一带一路”合作场景，并直接服务海外制造客户。</desc><metadata>{&quot;source_page&quot;:17,&quot;source_sha256&quot;:&quot;c83cd5c72dd8f63e25667cc2aa6cc6799864d7e31f16f412da1399137d71353c&quot;,&quot;narration_sha256&quot;:&quot;6a048e501d54f7922b177c1f99e9e017a517260cdf9983ff157706e2ff2813e2&quot;,&quot;narration&quot;:&quot;市场空间不能只看国内，但数字必须先把口径说清。国家统计局 2025 年 12 月数据里，通用设备、专用设备、电气机械、电子设备和仪器仪表 5 类规模以上工业企业合计 142,976 家，约 14.30 万家。这是更接近近期企业销售与伙伴拓展的优先客群。第五次全国经济普查统计的 122.4 万个企业法人仍保留为最新全量长尾边界，其中包含大量小微和不适用主体，不能与规上企业数相加。现有 73.4 亿元国内 TAM 和 22 亿元国内 SAM 仍是基于全量法人和互斥档位的情景测算，没有因换上新数字而暗中重算；第 3 年 6,334 个期末付费组织约相当于 2025 年规上优先池的 4.4%，1.91 亿元 ARR 仍未计入海外增量。增长路径分三步。第一步在国内验证产品、价格、续费和交付方法。第二步配合技术出海，与国内装备厂商、OEM、工程商和系统集成伙伴一起进入海外现场，让 PSkill、端侧模型和交付方法随设备一体出海，主动对接共建“一带一路”设备、工程与运维合作场景；2025 年机械工业对共建国家出口同比增长 24.7%，说明这条渠道具备现实基础。第三步直接服务海外制造商和服务网络，逐区域解决多语言、合规、数据边界、本地化部署、定价与支持。两份 2025 年行业研报将全球 Connected Worker 邻近市场估在约 86 亿到 94 亿美元，但它包含硬件、软件与服务，只作方向参照，不叠加到 PSOP TAM。规模化底座仍是伙伴交付，海外还要按区域补充本地伙伴、合规与支持能力。&quot;,&quot;visual_sources&quot;:[]}</metadata>
