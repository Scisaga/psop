<g id="title"><text x="64" y="98" dominant-baseline="hanging" font-size="52" fill="#183132" font-weight="700" data-max-width="1472" >市场空间，从国内验证走向全球复制</text><text x="64" y="176" dominant-baseline="hanging" font-size="24" fill="#506D64" font-weight="400" data-max-width="1472" >国内市场是可核验基本盘；配合技术出海和共建“一带一路”，同时直接服务海外客户。</text></g>
