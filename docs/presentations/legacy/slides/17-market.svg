ght="500" data-max-width="193" >待按国家 / 区域测算</text></g><g id="beat_03"><rect x="616" y="365" width="286" height="292" rx="16" fill="#F8FFFB" stroke="#C5DED2" stroke-width="1.5" /><rect x="638" y="382" width="120" height="36" rx="9" fill="#E2F3EA" /><text x="652" y="389" dominant-baseline="hanging" font-size="19" fill="#004D43" font-weight="500" data-max-width="92" >01 国内</text><text x="638" y="429" dominant-baseline="hanging" font-size="26" fill="#183132" font-weight="600" data-max-width="242" >验证可复制基本盘</text><line x1="638" y1="474" x2="880" y2="474" stroke="#C5DED2" stroke-width="2"/><text x="638" y="493" dominant-baseline="hanging" font-size="22" fill="#004D43" font-weight="700" data-max-width="242" >5 万激活 → 5,000 专业</text><text x="638" y="531" dominant-baseline="hanging" font-size="22" fill="#004D43" font-weight="700" data-max-width="242" >1,300 商机 → 260 新客</text><rect x="638" y="575" width="242" height="36" rx="9" fill="#FFFFFF" /><text x="652" y="582" dominant-baseline="hanging" font-size="18" fill="#004D43" font-weight="500" data-max-width="214" >价格 · 续费 · 交付样板</text><text x="638" y="625" dominant-baseline="hanging" font-size="18" fill="#506D64" font-weight="500" data-max-width="242" >先把商业与交付模式跑通</text><line x1="905" y1="511" x2="925" y2="511" stroke="#004D43" stroke-width="2.5"/><path d="M917.1017569429866,515.3148298474379 L925,511 L917.1017569429866,506.6851701525622" fill="none" stroke="#004D43" stroke-width="2.5" stroke-linecap="round"/><rect x="933" y="365" width="286" height="292" rx="16" fill="#E9E9FF" stroke="#C7C9FA" stroke-width="1.5" /><rect x="955" y="382" width="145" height="36" rx="9" fill="#FFFFFF" /><text x="969" y="389" dominant-baseline="hanging" font-size="19" fill="#555ABD" font-weight="500" data-max-width="117" >02 技术出海</text><text x="955" y="429" dominant-baseline="hanging" font-size="26" fill="#183132" font-weight="600" data-max-width="242" >随国内设备走出去</text><line x1="955" y1="474" x2="1197" y2="474" stroke="#C7C9FA" stroke-width="2"/><text x="955" y="493" dominant-baseline="hanging" font-size="21" fill="#183132" font-weight="600" data-max-width="242" >装备 / OEM / 工程伙伴</text><text x="955" y="531" dominant-baseline="hanging" font-size="21" fill="#555ABD" font-weight="600" data-max-width="242" >PSkill + 模型随产品交付</text><rect x="955" y="575" width="242" height="44" rx="9" fill="#555ABD" /><text x="969" y="586" dominant-baseline="hanging" font-size="19" fill="#FFFFFF" font-weight="600" data-max-width="214" >对接共建“一带一路”</text><text x="955" y="630" dominant-baseline="hanging" font-size="16" fill="#555ABD" font-weight="600" data-max-width="242" >2025 对共建国家出口 +24.7%</text><line x1="1222" y1="511" x2="1242" y2="511" stroke="#555ABD" stroke-width="2.5"/><path d="M1234.1017569429866,515.3148298474379 L1242,511 L1234.1017569429866,506.6851701525622" fill="none" stroke="#555ABD" stroke-width="2.5" stroke-linecap="round"/><rect x="1250" y="365" width="286" height="292" rx="16" fill="#FFFFFF" stroke="#004D43" stroke-width="1.5" /><rect x="1272" y="382" width="145" height="36" rx="9" fill="#E2F3EA" /><text x="1286" y="389" dominant-baseline="hanging" font-size="19" fill="#004D43" font-weight="500" data-max-width="117" >03 海外客户</text><text x="1272" y="429" dominant-baseline="hanging" font-size="26" fill="#183132" font-weight="600" data-max-width="242" >直接承接全球客户</text><line x1="1272" y1="474" x2="1514" y2="474" stroke="#C5DED2" stroke-width="2"/><text x="1272" y="493" dominant-baseline="hanging" font-size="21" fill="#183132" font-weight="600" data-max-width="242" >制造商 / 服务商 / 运营方</text><text x="1272" y="531" dominant-baseline="hanging" font-size="20" fill="#506D64" font-weight="500" data-max-width="242" >多语言 · 数据边界 · 合规</text><rect x="1272" y="575" width="242" height="44" rx="9" fill="#E2F3EA" /><text x="1286" y="586" dominant-baseline="hanging" font-size="19" fill="#004D43" font-weight="600" data-max-width="214" >本地部署 + 区域伙伴</text><text x="1272" y="630" dominant-baseline="hanging" font-size="16" fill="#506D64" font-weigh