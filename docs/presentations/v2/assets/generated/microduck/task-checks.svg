<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-label="对象绑定、识别与复检记录检查" style="font-family:Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif"><title>对象绑定、识别与复检记录检查</title><defs><marker id="flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker></defs><rect x="0" y="0" width="1400" height="820" rx="0" fill="#F3F8FC" stroke="none" stroke-width="2"/><text x="49" y="71" font-size="31" font-weight="400" fill="#123B5D" text-anchor="start">S03 / 操作到了哪里，还缺什么依据？</text><rect x="49" y="140" width="403" height="422" rx="10" fill="white" stroke="#CADDE8" stroke-width="2"/><circle cx="108" cy="204" r="26" fill="#3AAFE6" stroke="none" stroke-width="3"/><text x="108" y="213" font-size="26" font-weight="400" fill="white" text-anchor="middle">1</text><text x="75" y="282" font-size="32" font-weight="400" fill="#3AAFE6" text-anchor="start">对象已绑定</text><text x="75" y="344" font-size="24" font-weight="400" fill="#123B5D" text-anchor="start">MD-01 / J01 / Rev.A</text><text x="75" y="410" font-size="23" font-weight="400" fill="#123B5D" text-anchor="start">设备与目标关节一致</text><rect x="75" y="467" width="351" height="61" rx="10" fill="#EAF3F8" stroke="none" stroke-width="2"/><text x="92" y="507" font-size="23" font-weight="400" fill="#3AAFE6" text-anchor="start">S03 / BOUND</text><rect x="498" y="140" width="403" height="422" rx="10" fill="white" stroke="#CADDE8" stroke-width="2"/><circle cx="557" cy="204" r="26" fill="#138F84" stroke="none" stroke-width="3"/><text x="557" y="213" font-size="26" font-weight="400" fill="white" text-anchor="middle">2</text><text x="524" y="282" font-size="32" font-weight="400" fill="#138F84" text-anchor="start">识别已有</text><text x="524" y="344" font-size="24" font-weight="400" fill="#123B5D" text-anchor="start">软件返回关联目标</text><text x="524" y="410" font-size="23" font-weight="400" fill="#123B5D" text-anchor="start">保留工具返回与来源</text><rect x="524" y="467" width="351" height="61" rx="10" fill="#EAF3F8" stroke="none" stroke-width="2"/><text x="541" y="507" font-size="23" font-weight="400" fill="#138F84" text-anchor="start">S03 / IDENTIFIED</text><rect x="947" y="140" width="403" height="422" rx="10" fill="white" stroke="#CADDE8" stroke-width="2"/><circle cx="1006" cy="204" r="26" fill="#B77A17" stroke="none" stroke-width="3"/><text x="1006" y="213" font-size="26" font-weight="400" fill="white" text-anchor="middle">3</text><text x="973" y="282" font-size="32" font-weight="400" fill="#B77A17" text-anchor="start">复检缺失</text><text x="973" y="344" font-size="24" font-weight="400" fill="#123B5D" text-anchor="start">查询没有取得记录</text><text x="973" y="410" font-size="23" font-weight="400" fill="#123B5D" text-anchor="start">请求复检，保持状态</text><rect x="973" y="467" width="351" height="61" rx="10" fill="#EAF3F8" stroke="none" stroke-width="2"/><text x="990" y="507" font-size="23" font-weight="400" fill="#B77A17" text-anchor="start">S03 / PENDING</text><rect x="49" y="623" width="1302" height="155" rx="10" fill="#123B5D" stroke="none" stroke-width="2"/><text x="77" y="676" font-size="31" font-weight="400" fill="white" text-anchor="start">满足身份、版本和复检条件，才能推进任务</text><text x="77" y="726" font-size="23" font-weight="400" fill="#C2DDEB" text-anchor="start">教学状态来自合成记录；实机完成以对应工具与验收记录证明。</text></svg>