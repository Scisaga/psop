<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-label="设备操作轨迹对齐与学习循环" style="font-family:Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif"><title>设备操作轨迹对齐与学习循环</title><defs><marker id="flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker></defs><rect x="0" y="0" width="1400" height="820" rx="0" fill="#F3F8FC" stroke="none" stroke-width="2"/><text x="49" y="72" font-size="32" font-weight="400" fill="#123B5D" text-anchor="start">一次设备操作，形成可审核的学习样本</text><rect x="38" y="132" width="295" height="217" rx="10" fill="white" stroke="#CADDE8" stroke-width="2"/><text x="61" y="181" font-size="27" font-weight="400" fill="#3AAFE6" text-anchor="start">State</text><text x="61" y="239" font-size="22" font-weight="400" fill="#123B5D" text-anchor="start">S03 / 待验证</text><text x="61" y="301" font-size="18" font-weight="400" fill="#123B5D" text-anchor="start">MD-01 / J01 / Rev.A</text><rect x="381" y="132" width="295" height="217" rx="10" fill="white" stroke="#CADDE8" stroke-width="2"/><text x="404" y="181" font-size="27" font-weight="400" fill="#B77A17" text-anchor="start">Observation</text><text x="404" y="239" font-size="22" font-weight="400" fill="#123B5D" text-anchor="start">识别已有，复检缺失</text><text x="404" y="301" font-size="18" font-weight="400" fill="#123B5D" text-anchor="start">MD-01 / J01 / Rev.A</text><rect x="724" y="132" width="295" height="217" rx="10" fill="white" stroke="#CADDE8" stroke-width="2"/><text x="747" y="181" font-size="27" font-weight="400" fill="#6E78D8" text-anchor="start">Action</text><text x="747" y="239" font-size="22" font-weight="400" fill="#123B5D" text-anchor="start">请求复检，保持状态</text><text x="747" y="301" font-size="18" font-weight="400" fill="#123B5D" text-anchor="start">MD-01 / J01 / Rev.A</text><rect x="1067" y="132" width="295" height="217" rx="10" fill="white" stroke="#CADDE8" stroke-width="2"/><text x="1090" y="181" font-size="27" font-weight="400" fill="#138F84" text-anchor="start">Result</text><text x="1090" y="239" font-size="22" font-weight="400" fill="#123B5D" text-anchor="start">关联实际检查反馈</text><text x="1090" y="301" font-size="18" font-weight="400" fill="#123B5D" text-anchor="start">MD-01 / J01 / Rev.A</text><rect x="38" y="398" width="1324" height="126" rx="10" fill="#123B5D" stroke="none" stroke-width="2"/><text x="66" y="451" font-size="32" font-weight="400" fill="white" text-anchor="start">EG 约束与验证反馈 → 对齐决策当时的信息</text><text x="66" y="493" font-size="24" font-weight="400" fill="#C2DDEB" text-anchor="start">设备身份 / 观察 / 工具返回 / 下一动作 / 完成条件</text><rect x="38" y="588" width="295" height="92" rx="10" fill="white" stroke="#CADDE8" stroke-width="2"/><text x="185" y="644" font-size="25" font-weight="400" fill="#3AAFE6" text-anchor="middle">来源与审核</text><rect x="381" y="588" width="295" height="92" rx="10" fill="white" stroke="#CADDE8" stroke-width="2"/><text x="528" y="644" font-size="25" font-weight="400" fill="#6E78D8" text-anchor="middle">微调 / 蒸馏</text><rect x="724" y="588" width="295" height="92" rx="10" fill="white" stroke="#CADDE8" stroke-width="2"/><text x="871" y="644" font-size="25" font-weight="400" fill="#138F84" text-anchor="middle">独立真实评测</text><rect x="1067" y="588" width="295" height="92" rx="10" fill="white" stroke="#CADDE8" stroke-width="2"/><text x="1214" y="644" font-size="25" font-weight="400" fill="#3AAFE6" text-anchor="middle">版本发布与回滚</text><text x="700" y="759" font-size="26" font-weight="400" fill="#138F84" text-anchor="middle">知识更新、模型训练和现场任务推进分别核验</text></svg>