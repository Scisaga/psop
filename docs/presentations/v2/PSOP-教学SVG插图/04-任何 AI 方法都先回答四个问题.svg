    <text x="64.000" y="177.000" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="24.001" font-weight="400" data-text="“用多模态模型理解任务”还不是一个可执行的实验。只有明确模型看到什么、应预测什么、正确答案如何取得，以及如何评分，才能判" aria-label="“用多模态模型理解任务”还不是一个可执行的实验。只有明确模型看到什么、应预测什么、正确答案如何取得，以及如何评分，才能判" xml:space="preserve" textLength="1440.001" lengthAdjust="spacingAndGlyphs" fill="#526578">“用多模态模型理解任务”还不是一个可执行的实验。只有明确模型看到什么、应预测什么、正确答案如何取得，以及如何评分，才能判</text>
