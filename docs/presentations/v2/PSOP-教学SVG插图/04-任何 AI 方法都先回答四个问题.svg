    <text x="570.000" y="617.000" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="25.000" font-weight="700" data-text="参考答案要有依据" aria-label="参考答案要有依据" xml:space="preserve" textLength="200.000" lengthAdjust="spacingAndGlyphs" fill="#14877D">参考答案要有依据</text>
