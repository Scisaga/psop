    <text x="1076.000" y="617.000" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="25.000" font-weight="700" data-text="评价必须对应目标" aria-label="评价必须对应目标" xml:space="preserve" textLength="200.000" lengthAdjust="spacingAndGlyphs" fill="#7756AA">评价必须对应目标</text>
