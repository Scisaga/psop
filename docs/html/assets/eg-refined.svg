<?xml version="1.0" encoding="UTF-8"?>
<svg id="eg-graph" viewBox="0 0 900 280" width="900" height="280" role="img" aria-labelledby="eg-title eg-desc" xmlns="http://www.w3.org/2000/svg">
<title id="eg-title">Microduck 安装与核验任务 EG</title>
<desc id="eg-desc">任务绑定设备后进入对齐安装，身份与复检两路记录经核验后汇合。只有两路记录同时满足条件时才可推进。所有通过状态在播放执行示例后显示，空状态节点不表示已完成。</desc>
<style><![CDATA[/* Native EG artwork. Marking and token movement are owned by demos.js. */
#eg-graph {
  color: #668b78;
  font-family: Arial, "Microsoft YaHei", "PingFang SC", sans-serif;
}
#eg-graph .eg-surface { fill: #101211; }
#eg-graph .eg-guide { fill: none; stroke: #839e91; stroke-width: .7; opacity: .15; }
#eg-graph .eg-phase {
  font-family: "SFMono-Regular", Consolas, monospace;
  font-size: 7.6px;
  letter-spacing: 1.35px;
  fill: #708a7c;
}
#eg-graph .eg-phase-number { fill: #a4bcac; letter-spacing: .3px; }
#eg-graph .eg-edges path {
  fill: none;
  stroke: #597b68;
  color: #597b68;
  stroke-width: 1.05;
  opacity: .82;
  marker-end: url(#eg-arrow);
  transition: stroke .45s, color .45s, opacity .45s;
}
#eg-graph .eg-edges path.is-active,
#eg-graph .eg-edges path.is-flowing {
  stroke: #ffa06d;
  color: #ffa06d;
  stroke-width: 1.45;
  opacity: 1;
}
#eg-graph .eg-edges path.is-passed { stroke: #b1dfc9; color: #b1dfc9; opacity: .86; }
#eg-graph .eg-edges path.is-blocked { stroke: #b58e62; color: #b58e62; stroke-dasharray: 2 5; opacity: .7; }
#eg-graph .eg-edges path.is-flowing { stroke-dasharray: 5 7; animation: eg-refined-flow 1.15s linear infinite; }
#eg-graph .eg-nodes .eg-place {
  fill: url(#eg-place-surface);
  stroke: #789a88;
  stroke-width: 1.05;
  opacity: 1;
  transition: fill .45s, stroke .45s;
}
#eg-graph .eg-nodes .eg-place-ring {
  fill: none;
  stroke: #8aaf9a;
  stroke-width: .5;
  stroke-dasharray: none;
  opacity: .27;
  pointer-events: none;
}
#eg-graph .eg-nodes .eg-place-halo {
  fill: none;
  stroke: #ffa06d;
  stroke-width: .6;
  stroke-dasharray: none;
  opacity: 0;
  transition: opacity .45s, stroke .45s;
  pointer-events: none;
}
#eg-graph .eg-nodes .eg-precision {
  fill: none;
  stroke: #b1d1bd;
  stroke-width: .65;
  opacity: .45;
  pointer-events: none;
}
#eg-graph .eg-nodes .eg-transition {
  fill: url(#eg-gate-surface);
  stroke: #8fae9c;
  stroke-width: .75;
  opacity: 1;
  transition: fill .45s, stroke .45s;
}
#eg-graph .eg-nodes .eg-gate-detail {
  fill: none;
  stroke: #c0d7c7;
  stroke-width: .65;
  opacity: .7;
  pointer-events: none;
}
#eg-graph .eg-nodes .eg-glyph {
  fill: none;
  stroke: #a0c6b1;
  stroke-width: .95;
  stroke-linecap: round;
  stroke-linejoin: round;
  opacity: .78;
  transition: stroke .45s, opacity .3s;
  pointer-events: none;
}
#eg-graph .eg-nodes .eg-glyph-check { opacity: 0; }
#eg-graph .eg-nodes .eg-node-label {
  fill: #bbcec1;
  font-size: 14px;
  font-weight: 500;
  letter-spacing: .15px;
  transition: fill .4s;
}
#eg-graph .eg-nodes [data-eg-node="t_join"] .eg-node-label { font-size: 14px; font-weight: 600; }
#eg-graph .eg-nodes .eg-node-meta {
  font-family: "SFMono-Regular", Consolas, monospace;
  font-size: 7.6px;
  font-weight: 400;
  letter-spacing: .8px;
  fill: #6e8979;
  transition: fill .4s;
}
#eg-graph .eg-nodes .eg-join-leader { fill: none; stroke: #6b8f7a; stroke-width: .65; stroke-dasharray: 2 3; opacity: .55; }
#eg-graph .eg-nodes .is-active .eg-place { fill: url(#eg-place-active); stroke: #ffa06d; }
#eg-graph .eg-nodes .is-active .eg-place-ring { stroke: #f8bf94; opacity: .33; }
#eg-graph .eg-nodes .is-active .eg-place-halo { opacity: .24; }
#eg-graph .eg-nodes .is-active .eg-transition { fill: url(#eg-gate-active); stroke: #ffc294; }
#eg-graph .eg-nodes .is-active .eg-gate-detail { stroke: #ffe0c6; opacity: .8; }
#eg-graph .eg-nodes .is-active .eg-glyph,
#eg-graph .eg-nodes .is-active .eg-precision { stroke: #ffc194; }
#eg-graph .eg-nodes .is-active .eg-node-label { fill: #ffc29b; }
#eg-graph .eg-nodes .is-active .eg-node-meta { fill: #c3906c; }
#eg-graph .eg-nodes .is-active .eg-join-leader { stroke: #dfa477; }
#eg-graph .eg-nodes .is-passed .eg-place { fill: url(#eg-place-passed); stroke: #b1dfc9; }
#eg-graph .eg-nodes .is-passed .eg-place-ring { stroke: #b1dfc9; opacity: .36; }
#eg-graph .eg-nodes .is-passed .eg-place-halo { stroke: #b1dfc9; opacity: .12; }
#eg-graph .eg-nodes .is-passed .eg-transition { fill: url(#eg-gate-passed); stroke: #cee8dc; }
#eg-graph .eg-nodes .is-passed .eg-gate-detail,
#eg-graph .eg-nodes .is-passed .eg-glyph { stroke: #cee8dc; }
#eg-graph .eg-nodes .is-passed .eg-node-label { fill: #c5e8d6; }
#eg-graph .eg-nodes .is-passed .eg-node-meta { fill: #87aa94; }
#eg-graph .eg-nodes .is-passed .eg-join-leader { stroke: #afd5bf; }
#eg-graph .eg-nodes .is-passed .eg-glyph-await { opacity: 0; }
#eg-graph .eg-nodes .is-passed .eg-glyph-check { opacity: .92; }
#eg-graph .eg-nodes .is-blocked .eg-place { fill: #211e18; stroke: #b3936e; stroke-dasharray: 2.5 3; }
#eg-graph .eg-nodes .is-blocked .eg-place-ring { stroke: #b3936e; opacity: .23; }
#eg-graph .eg-nodes .is-blocked .eg-place-halo { stroke: #b3936e; opacity: .13; }
#eg-graph .eg-nodes .is-blocked .eg-transition { fill: url(#eg-gate-blocked); stroke: #bd9b72; opacity: 1; }
#eg-graph .eg-nodes .is-blocked .eg-gate-detail,
#eg-graph .eg-nodes .is-blocked .eg-glyph { stroke: #d0ad80; }
#eg-graph .eg-nodes .is-blocked .eg-node-label { fill: #d1b28d; }
#eg-graph .eg-nodes .is-blocked .eg-node-meta { fill: #a48864; }
#eg-graph .eg-nodes .is-blocked .eg-join-leader { stroke: #b79970; }
#eg-graph .eg-nodes .has-token .eg-glyph { opacity: 0; }
#eg-graph .eg-token {
  fill: url(#eg-token-core);
  stroke: #ffe3ca;
  stroke-width: .75;
  r: 5px;
  filter: url(#eg-token-glow);
  pointer-events: none;
}
.is-demo-paused #eg-graph .is-flowing { animation-play-state: paused; }
@keyframes eg-refined-flow { to { stroke-dashoffset: -24; } }
@media (prefers-reduced-motion: reduce) {
  #eg-graph .eg-edges path.is-flowing { animation: none; stroke-dasharray: none; }
  #eg-graph .eg-nodes *, #eg-graph .eg-edges path { transition: none; }
}
]]></style>
<defs>
  <radialGradient id="eg-place-surface" cx="35%" cy="24%" r="80%"><stop stop-color="#1d2a22"/><stop offset="1" stop-color="#101613"/></radialGradient>
  <radialGradient id="eg-place-active" cx="40%" cy="28%" r="78%"><stop stop-color="#34291e"/><stop offset="1" stop-color="#211c17"/></radialGradient>
  <radialGradient id="eg-place-passed" cx="35%" cy="24%" r="80%"><stop stop-color="#243c30"/><stop offset="1" stop-color="#14241c"/></radialGradient>
  <linearGradient id="eg-gate-surface" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#415e4e"/><stop offset=".45" stop-color="#6b8c76"/><stop offset="1" stop-color="#314b3d"/></linearGradient>
  <linearGradient id="eg-gate-active" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#b57a51"/><stop offset=".46" stop-color="#efb182"/><stop offset="1" stop-color="#9b6647"/></linearGradient>
  <linearGradient id="eg-gate-passed" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#729c83"/><stop offset=".46" stop-color="#b7d9c3"/><stop offset="1" stop-color="#648b74"/></linearGradient>
  <linearGradient id="eg-gate-blocked" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#554533"/><stop offset=".46" stop-color="#9c815c"/><stop offset="1" stop-color="#4f422f"/></linearGradient>
  <radialGradient id="eg-token-core" cx="33%" cy="25%" r="75%"><stop stop-color="#ffe1bc"/><stop offset=".35" stop-color="#ffb385"/><stop offset="1" stop-color="#ee8a58"/></radialGradient>
  <filter id="eg-token-glow" x="-160%" y="-160%" width="420%" height="420%" color-interpolation-filters="sRGB"><feGaussianBlur in="SourceGraphic" stdDeviation="2.5"/><feComponentTransfer><feFuncA type="linear" slope=".48"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <marker id="eg-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" markerUnits="userSpaceOnUse" orient="auto"><path d="M2 2L8 5L2 8" fill="none" stroke="context-stroke" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
