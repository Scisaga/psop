 const minX=Math.max(0,Math.floor(Math.min(...points.map(p=>p[0])))),maxX=Math.min(599,Math.ceil(Math.max(...points.map(p=>p[0])))),minY=Math.max(0,Math.floor(Math.min(...points.map(p=>p[1])))),maxY=Math.min(449,Math.ceil(Math.max(...points.map(p=>p[1]))));

 for(let y=minY;y<=maxY;y+=2)for(let x=minX;x<=maxX;x+=2){const offset=4*((449-y)*600+x);if(bytes[offset]>10)continue;ray.setFromCamera(new T.Vector2((x+.5)/300-1,1-(y+.5)/225),camera);const hits=ray.intersectObjects([floor,part,occluder],false);if(!hits.some(h=>h.object===part))continue;const hidden=bytes[offset+1]>128;if(hits[0].object===part){result.visible++;if(hidden)result.false_occluded++;}else{result.occluded++;if(!hidden)result.false_visible++;}}
